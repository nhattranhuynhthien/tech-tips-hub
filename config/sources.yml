# config/sources.yml
# Danh sách nguồn RSS / API uy tín tổng hợp thủ thuật công nghệ
# kind: tips (nguồn chuyên hướng dẫn, nhận bài chuẩn) | news (nguồn tin tức, bắt buộc qua bộ lọc howto)
# min_score: điểm số tối thiểu của cộng đồng (dành cho Hacker News)
# weight: trọng số uy tín từ 0.5 đến 1.5

# === Nguồn Quốc tế (English) ===
- id: howtogeek
  name: How-To Geek
  url: https://www.howtogeek.com/feed/
  site_url: https://www.howtogeek.com
  type: rss
  lang: en
  kind: tips
  weight: 1.1
  categories: [windows, android, macos, browser, office, hardware]
  description: Hướng dẫn chuyên sâu và thủ thuật công nghệ cho mọi nền tảng

- id: itsfoss
  name: It's FOSS
  url: https://itsfoss.com/feed/
