# config/blocklist.yml
# Danh sách từ khóa và tên miền bị loại bỏ khỏi luồng tổng hợp thủ thuật

keywords:
  - deal
  - deals
  - discount
  - coupon
  - sale
  - off on
  - price drop
  - sponsored
  - giveaway
  - affiliate
  - promo code
  - best price
  - black friday
  - prime day
  - cyber monday
  - giam gia
  - khuyen mai
  - ma giam gia
  - gia re
  - ban chay
  - quang cao
  - tai tro
  - "促销"
  - "折扣"
  - "优惠"
  - "限时"
  - "直降"
  - "国补"
  - "降价"
  - "新低"

domains: []

title_patterns:
  - "^deal alert:"
  - "for only \\$\\d+"
  - "save \\$\\d+ on"
  - "\\d+% off"
  - "săn sale"

