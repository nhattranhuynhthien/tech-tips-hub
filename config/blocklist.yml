# config/blocklist.yml
# Danh sách từ khóa và tên miền bị loại bỏ khỏi luồng tổng hợp thủ thuật

keywords:
  - deal
  - deals
  - discount
  - coupon
  - sale
  - off on
  - price drop
  - sponsored
  - giveaway
  - affiliate
  - promo code
  - best price
  - black friday
  - prime day
  - cyber monday
  - giam gia
  - giảm giá
  - khuyen mai
  - khuyến mãi
  - ma giam gia
  - mã giảm giá
  - gia re
  - giá rẻ
  - ban chay
  - quang cao
  - quảng cáo
  - tai tro
  - tài trợ
  - "促销"
  - "折扣"
  - "优惠"
  - "限时"
  - "直降"
  - "国补"
  - "降价"
  - "新低"
  - "双十一"
  - "双11"
  - "喜加一"
  - "官方补贴"
  - "严选好货"
  - "神券"
  - "到手价"
  - "立减"
