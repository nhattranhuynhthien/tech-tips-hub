domains: []

title_patterns:
  - "^deal alert:"
  - "for only \\$\\d+"
  - "save \\$\\d+ on"
  - "\\d+% off"
  - "săn sale"
  - "\\d+(?:\\.\\d+)?\\s*折(?!叠)"
