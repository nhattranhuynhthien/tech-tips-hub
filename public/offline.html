<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F1114" />
    <title>Offline — tips.hub</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
        --bg-primary: #0F1114;
        --bg-surface: #171A1E;
        --bg-muted: #23272D;
        --border-color: #2A2F35;
        --text-primary: #ECEAE4;
        --text-secondary: #A3A8AD;
        --text-muted: #8E959E;
        --accent: #FFB547;
        --accent-hero: #FFB547;
      }
      [data-theme="light"] {
        color-scheme: light;
        --bg-primary: #F7F6F2;
        --bg-surface: #FFFFFF;
        --bg-muted: #ECEAE3;
        --border-color: #DCD8CE;
        --text-primary: #17191C;
        --text-secondary: #4A4F57;
        --text-muted: #5C636B;
        --accent: #9A4406;
        --accent-hero: #FFB547;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
      }
      .card {
        width: 100%;
        max-width: 30rem;
        background: var(--bg-surface);
        border: 1px solid var(--border-color);
        border-radius: 1rem;
        padding: 2rem;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.875rem;
        font-weight: 700;
        margin-bottom: 1.25rem;
      }
      .dot {
        width: 0.625rem;
        height: 0.625rem;
        border-radius: 9999px;
        background: var(--accent-hero);
      }
      .status-pill {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.35rem 0.75rem;
        border-radius: 0.75rem;
        border: 1px solid var(--border-color);
        background: var(--bg-muted);
        color: var(--accent);
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.75rem;
        font-weight: 700;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.75rem 0;
        font-size: 1.5rem;
        line-height: 1.3;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem 0;
        color: var(--text-secondary);
        font-size: 0.9rem;
        line-height: 1.6;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.625rem 1.1rem;
        border-radius: 0.75rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 0.8rem;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
        border: 1px solid transparent;
      }
      .btn-primary {
        background: var(--accent-hero);
        color: #15110A;
      }
      .btn-secondary {
        background: var(--bg-muted);
        border-color: var(--border-color);
        color: var(--text-primary);
      }
      .btn:focus-visible {
        outline: 3px solid var(--accent);
        outline-offset: 2px;
      }
    </style>
    <script>
      (function () {
        try {
          if (localStorage.getItem('techtips_theme') === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
            var meta = document.querySelector('meta[name="theme-color"]');
            if (meta) meta.setAttribute('content', '#F7F6F2');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <span class="dot" aria-hidden="true"></span>
        <span>tips.hub</span>
      </div>

      <div class="status-pill">
        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M2 2l20 20" stroke-width="2" stroke-linecap="round"></path>
          <path d="M8.5 16.5a5 5 0 0 1 7 0" stroke-width="2" stroke-linecap="round"></path>
          <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" stroke-width="2" stroke-linecap="round"></path>
          <path d="M10.71 5.05A16 16 0 0 1 22.58 9" stroke-width="2" stroke-linecap="round"></path>
          <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" stroke-width="2" stroke-linecap="round"></path>
          <line x1="12" y1="20" x2="12.01" y2="20" stroke-width="2.5" stroke-linecap="round"></line>
        </svg>
        <span>$ net: offline</span>
      </div>

      <h1 id="offline-title">Không có kết nối mạng</h1>
      <p id="offline-desc">
        Thiết bị của bạn hiện đang ngoại tuyến nên chưa thể tải trang này. Bạn vẫn có thể xem các thủ thuật đã lưu cục bộ hoặc thử tải lại khi có mạng.
      </p>

      <div class="actions">
        <button id="retry-btn" type="button" class="btn btn-primary">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12a9 9 0 1 1-2.64-6.36" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
            <polyline points="21 3 21 9 15 9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></polyline>
          </svg>
          <span id="retry-label">Thử tải lại</span>
        </button>

        <a id="saved-link" href="/vi/saved" class="btn btn-secondary">
          <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
          <span id="saved-label">Thủ thuật đã lưu</span>
        </a>
      </div>
    </main>

    <script>
      (function () {
        var isEn = false;
        try {
          isEn = localStorage.getItem('techtips_lang') === 'en';
        } catch (e) {}
        if (isEn) {
          document.documentElement.lang = 'en';
          document.title = 'Offline — tips.hub';
          var title = document.getElementById('offline-title');
          var desc = document.getElementById('offline-desc');
          var retryLabel = document.getElementById('retry-label');
          var savedLink = document.getElementById('saved-link');
          var savedLabel = document.getElementById('saved-label');
          if (title) title.textContent = 'You are offline';
          if (desc) {
            desc.textContent =
              'Your device is currently offline and this page is not cached yet. You can open your saved tips or reload once your connection returns.';
          }
          if (retryLabel) retryLabel.textContent = 'Try again';
          if (savedLink) savedLink.setAttribute('href', '/en/saved');
          if (savedLabel) savedLabel.textContent = 'Saved tips';
        }
        var retryBtn = document.getElementById('retry-btn');
        if (retryBtn) {
          retryBtn.addEventListener('click', function () {
            window.location.reload();
          });
        }
      })();
    </script>
  </body>
</html>
