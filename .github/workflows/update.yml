name: update-tips

on:
  schedule:
    - cron: "0 */4 * * *" # Chạy tự động mỗi 4 giờ
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-tips
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run data aggregation pipeline
        run: python scripts/run_pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and push changes
        run: |
          git config user.name "tips-bot"
          git config user.email "tips-bot@users.noreply.github.com"
          git add data
          git diff --staged --quiet || git commit -m "chore(data): auto-update tech tips [skip ci]"
          git push
