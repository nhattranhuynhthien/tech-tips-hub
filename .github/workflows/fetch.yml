name: fetch-tips

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-tips
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore source validators and ETag state
        uses: actions/cache@v4
        with:
          path: data/state.json
          key: fetch-state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            fetch-state-${{ runner.os }}-

      - name: Install pipeline dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch, filter, deduplicate, and translate tips
        run: python scripts/run_pipeline.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}

      - name: Validate resulting data
        run: python scripts/qa.py

      - name: Commit only when tips changed
        run: |
          git config user.name "tips-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/index.json
          if [ -d data/archive ]; then git add data/archive; fi
          if git diff --cached --quiet; then
            echo "No tip data changed; skipping commit and deployment."
          else
            git commit -m "chore(data): hourly tips update [skip ci]"
            git push
          fi
