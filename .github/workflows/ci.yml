name: CI Build & Test

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'data/**'
  pull_request:
    branches: [main, master]

jobs:
  test-pipeline:
    name: Test Python Pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r scripts/requirements.txt
      - name: Validate Pipeline Script Syntax
        run: |
          python -m py_compile scripts/textclean.py
          python -m py_compile scripts/filters.py
          python -m py_compile scripts/classify.py
          python -m py_compile scripts/dedupe.py
          python -m py_compile scripts/score.py
          python -m py_compile scripts/translate.py
          python -m py_compile scripts/fetch.py
          python -m py_compile scripts/run_pipeline.py
          python -m py_compile scripts/qa.py
          python -m py_compile scripts/check_source.py
          python -m py_compile scripts/slug.py
          python -m py_compile scripts/migrate.py
          python -m py_compile scripts/translate_all.py
          python -m py_compile scripts/sync_favicons.py
      - name: Run Python unit tests
        run: python tests/test_translate.py
      - name: Run Python Red-Team adversarial tests
        run: python -m unittest tests/test_red_team_pipeline.py -v
      - name: Run Quality Assurance on Existing Data
        run: python scripts/qa.py

  build-frontend:
    name: Build Astro Static Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Type-check Telegram webhook
        run: npm run check:telegram
      - name: Run Telegram webhook unit & integration tests
        run: npm run test:telegram
      - name: Run Telegram Red-Team adversarial tests
        run: node tests/test_red_team_telegram.mjs
      - name: Type-check Astro project
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Run Frontend, SEO & PWA Red-Team tests
        run: node tests/test_red_team_frontend.mjs
